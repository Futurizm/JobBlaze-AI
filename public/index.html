<!DOCTYPE html>
<html lang="en">
<head>
  <title>AR YouTube Link</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.1.7/aframe/build/aframe-ar.js"></script>
  <style>
    #link-button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgb(99, 102, 241);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      display: none; /* Скрыто по умолчанию */
      z-index: 1000;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
    <a-marker type="pattern" url="/pattern-hiro.patt">
      <a-plane
        id="youtubeLink" 
        width="1.5"
        height="1.3"
        position="0 0 0"
        rotation="-90 0 0"
        material="shader: flat; scale: 2 2 2; src: /images/card.png"
      ></a-plane>
    </a-marker>
    
    <!-- Кнопка в 2D-интерфейсе (работает на клик) -->
    <button id="link-button">Перейти на вакансию</button>
    
    <a-entity camera></a-entity>
    
    <script>
      let youtubeUrl = "";
      const marker = document.querySelector('a-marker');
      const linkButton = document.getElementById('link-button');
      
      // Загружаем JSON при обнаружении маркера
      marker.addEventListener('markerFound', function() {
        fetch('/data.json')
          .then(response => response.json())
          .then(data => {
            youtubeUrl = data.link;
            document.getElementById('youtubeLink').setAttribute('value', data.link);
            linkButton.style.display = "block"; // Показываем кнопку
          })
          .catch(error => {
            console.error('Error loading JSON:', error);
            document.getElementById('youtubeLink').setAttribute('value', 'Error loading link');
          });
      });
      
      // Скрываем кнопку, когда маркер потерян
      marker.addEventListener('markerLost', function() {
        linkButton.style.display = "none";
      });
      
      // Открываем ссылку при клике на кнопку
      linkButton.addEventListener('click', function() {
        if (youtubeUrl) window.open(youtubeUrl, '_blank');
      });
    </script>
  </a-scene>
</body>
</html>
